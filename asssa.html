<script type="text/plain" id="onlyus-database-template">-- ONLY US / Ahmed + Mahra / HTML edition
-- Run in a NEW Supabase project's SQL Editor after creating the two Auth users.
-- Replace the two UUID placeholders with the IDs from Authentication > Users.
-- Never put passwords, service_role keys, or database passwords in this script.
begin;
create schema if not exists onlyus_private;
revoke all on schema onlyus_private from public, anon, authenticated;
create table if not exists onlyus_private.members (
  user_id uuid primary key references auth.users(id) on delete cascade,
  name text unique not null check (name in ('Ahmed','Mahra'))
);
create table if not exists onlyus_private.space (
  id integer primary key check (id=1),
  revision bigint not null default 1,
  body jsonb not null
);
alter table onlyus_private.members enable row level security;
alter table onlyus_private.space enable row level security;
revoke all on all tables in schema onlyus_private from public, anon, authenticated;
-- This is the only account allowlist. Never allow browser clients to change it.
insert into onlyus_private.members(user_id,name) values
 ('AHMED_USER_ID'::uuid,'Ahmed'),
 ('MAHRA_USER_ID'::uuid,'Mahra')
on conflict(name) do update set user_id=excluded.user_id;
insert into onlyus_private.space(id,body) values (1, '{"settings":{"id":1,"start_date":"","ahmed_birthday":"","mahra_birthday":"","timezone":"Asia/Dubai","version":1},"notes":[],"photos":[],"tasks":[],"events":[],"moods":[],"daily_answers":[],"quizzes":[],"quiz_answers":[],"game":{"id":1,"board":[null,null,null,null,null,null,null,null,null],"turn":"Ahmed","winner":null,"round":1,"version":1},"game_stats":{},"memory_scores":[],"favorites":{"Ahmed":[],"Mahra":[]},"hugs":[],"total_hugs":0}'::jsonb)
on conflict(id) do nothing;

create or replace function public.onlyus_identity()
returns text language sql stable security definer set search_path='' as $$
 select name from onlyus_private.members where user_id=auth.uid();
$$;
create or replace function public.onlyus_status()
returns jsonb language plpgsql stable security definer set search_path='' as $$
declare n text := public.onlyus_identity(); r onlyus_private.space%rowtype;
begin
 if n is null then raise exception 'Only the two approved accounts may enter.' using errcode='42501'; end if;
 select * into r from onlyus_private.space where id=1;
 return jsonb_build_object('revision',r.revision,'server_now',now(),'today',
 to_char(now() at time zone (r.body#>>'{settings,timezone}'),'YYYY-MM-DD'),'user',n);
end;
$$;
create or replace function public.onlyus_read()
returns jsonb language plpgsql stable security definer set search_path='' as $$
declare n text := public.onlyus_identity(); d jsonb; rev bigint; day text;
begin
 if n is null then raise exception 'Only the two approved accounts may enter.' using errcode='42501'; end if;
 select body,revision into d,rev from onlyus_private.space where id=1;
 day := to_char(now() at time zone (d#>>'{settings,timezone}'),'YYYY-MM-DD');
 -- Never send a partner's correct quiz answer before they submit their guess.
 d := jsonb_set(d,'{quizzes}',coalesce((select jsonb_agg(case
  when q->>'author'=n or exists(select 1 from jsonb_array_elements(d->'quiz_answers') a
    where a->>'quiz_id'=q->>'id' and a->>'user_id'=n)
  then q else q-'correct' end order by ord)
  from jsonb_array_elements(d->'quizzes') with ordinality as v(q,ord)),'[]'::jsonb));
 d := jsonb_set(d,'{quiz_answers}',coalesce((select jsonb_agg(a) from jsonb_array_elements(d->'quiz_answers') a
  where a->>'user_id'=n or exists(select 1 from jsonb_array_elements(d->'quizzes') q
   where q->>'id'=a->>'quiz_id' and q->>'author'=n)),'[]'::jsonb));
 d := d || jsonb_build_object('daily_answered_by',coalesce((select jsonb_agg(a->'user_id')
  from jsonb_array_elements(d->'daily_answers') a where a->>'day'=day),'[]'::jsonb));
 -- Daily answer contents remain private until both accounts answer that day.
 d := jsonb_set(d,'{daily_answers}',coalesce((select jsonb_agg(a) from jsonb_array_elements(d->'daily_answers') a
  where a->>'user_id'=n or 2=(select count(*) from jsonb_array_elements(d->'daily_answers') b
  where b->>'day'=a->>'day')),'[]'::jsonb));
 d := jsonb_set(d,'{favorites}',jsonb_build_object('Ahmed',case when n='Ahmed' then d#>'{favorites,Ahmed}' else '[]'::jsonb end,
 'Mahra',case when n='Mahra' then d#>'{favorites,Mahra}' else '[]'::jsonb end));
 return d || jsonb_build_object('revision',rev,'today',day,'server_now',now());
end;
$$;

-- Validation helpers run only inside the checked entrypoint.
create or replace function onlyus_private.txt(b jsonb,k text,lo integer,hi integer)
returns text language plpgsql immutable set search_path='' as $$
declare v text;
begin
 if b ? k and jsonb_typeof(b->k)<>'string' then raise exception 'Invalid text field: %',k; end if;
 v:=coalesce(b->>k,'');
 if length(btrim(v))<lo or length(v)>hi then raise exception 'Check the length of %.',k; end if;
 return v;
end;
$$;
create or replace function onlyus_private.day(b jsonb,k text,required boolean default false)
returns text language plpgsql immutable set search_path='' as $$
declare v text := onlyus_private.txt(b,k,0,10); dt date;
begin
 if v='' and not required then return v; end if;
 if v !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' then raise exception 'Choose a valid date for %.',k; end if;
 dt:=v::date;
 if dt<'1900-01-01'::date or dt>'2200-12-31'::date then raise exception 'Choose a date between 1900 and 2200.'; end if;
 return v;
end;
$$;
create or replace function onlyus_private.intval(b jsonb,k text,lo integer,hi integer)
returns integer language plpgsql immutable set search_path='' as $$
declare v integer;
begin
 if coalesce(b->>k,'') !~ '^[0-9]+$' then raise exception 'Invalid number for %.',k; end if;
 v:=(b->>k)::integer;
 if v<lo or v>hi then raise exception 'Invalid number for %.',k; end if;
 return v;
end;
$$;
create or replace function onlyus_private.flag(b jsonb,k text)
returns integer language plpgsql immutable set search_path='' as $$
begin
 if coalesce(b->>k,'false') in ('true','1') then return 1; end if;
 if coalesce(b->>k,'false') in ('false','0') then return 0; end if;
 raise exception 'Invalid yes/no value.';
end;
$$;
create or replace function onlyus_private.item(kind text,b jsonb)
returns jsonb language plpgsql immutable set search_path='' as $$
declare v jsonb; s text; opts jsonb;
begin
 if kind='notes' then
  s:=onlyus_private.txt(b,'color',1,12);
  if s not in ('rose','sage','butter','lavender') then raise exception 'Choose a note color.'; end if;
  v:=jsonb_build_object('title',onlyus_private.txt(b,'title',0,100),'body',onlyus_private.txt(b,'body',1,8000),
  'color',s,'pinned',onlyus_private.flag(b,'pinned'));
 elsif kind='tasks' then
  if coalesce(b->>'category','') not in ('adventure','todo','wishlist') or coalesce(b->>'assignee','') not in ('Ahmed','Mahra','Both') then raise exception 'Choose a valid plan category and person.'; end if;
  v:=jsonb_build_object('title',onlyus_private.txt(b,'title',1,180),'category',b->>'category','assignee',b->>'assignee',
  'due_date',onlyus_private.day(b,'due_date'),'done',onlyus_private.flag(b,'done'));
 elsif kind='photos' then
  v:=jsonb_build_object('caption',onlyus_private.txt(b,'caption',0,500),'moment_date',onlyus_private.day(b,'moment_date'));
 elsif kind='events' then
  v:=jsonb_build_object('title',onlyus_private.txt(b,'title',1,120),'date',onlyus_private.day(b,'date',true),'annual',onlyus_private.flag(b,'annual'));
 elsif kind='quizzes' then
  opts:=b->'options';
  if jsonb_typeof(opts) is distinct from 'array' or jsonb_array_length(opts)<>4 then raise exception 'Add four answers.'; end if;
  if exists(select 1 from jsonb_array_elements(opts) o where jsonb_typeof(o)<>'string' or length(btrim(o#>>'{}'))<1 or length(o#>>'{}')>150)
  or (select count(distinct lower(btrim(o#>>'{}'))) from jsonb_array_elements(opts) o)<>4 then raise exception 'Use four different answers, up to 150 characters each.'; end if;
  v:=jsonb_build_object('question',onlyus_private.txt(b,'question',1,250),'options',opts,'correct',onlyus_private.intval(b,'correct',0,3));
 else raise exception 'Unknown item type.';
 end if;
 return v;
end;
$$;

create or replace function public.onlyus_write(p_path text,p_method text,p_body jsonb default '{}'::jsonb)
returns jsonb language plpgsql security definer set search_path='' as $$
declare n text := public.onlyus_identity(); d jsonb; rev bigint; day text; kind text; rid text; action text;
 rowval jsonb; arr jsonb; idx integer; changed jsonb; newrow jsonb; g jsonb; bd jsonb; cell integer;
 winner text; line jsonb; v integer; s text; st jsonb; result jsonb:='{"ok":true}'::jsonb;
 new_id text:=gen_random_uuid()::text; stamp text:=to_char(now() at time zone 'UTC','YYYY-MM-DD"T"HH24:MI:SS.MS"Z"');
 bytes bigint; obj text;
begin
 if n is null then raise exception 'Only the two approved accounts may enter.' using errcode='42501'; end if;
 if jsonb_typeof(p_body) is distinct from 'object' or octet_length(p_body::text)>30000 then raise exception 'Invalid or oversized request.'; end if;
 if p_method not in ('POST','PATCH','DELETE') then raise exception 'Unsupported request.'; end if;
 select body,revision into d,rev from onlyus_private.space where id=1 for update;
 day:=to_char(now() at time zone (d#>>'{settings,timezone}'),'YYYY-MM-DD');
 kind:=split_part(p_path,'/',1); rid:=split_part(p_path,'/',2); action:=split_part(p_path,'/',3);
 if kind in ('notes','photos','tasks','events','quizzes') and p_method in ('PATCH','DELETE') then
  select value,(ordinality-1)::integer into rowval,idx from jsonb_array_elements(d->kind) with ordinality where value->>'id'=rid;
  if rowval is null then raise exception 'That item no longer exists.'; end if;
  if coalesce((p_body->>'version')::integer,-1)<>coalesce((rowval->>'version')::integer,1) then raise exception 'This item changed. Refresh and try again.' using errcode='40001'; end if;
  if kind='quizzes' and rowval->>'author'<>n then raise exception 'Only the author may remove a quiz.'; end if;
  if p_method='DELETE' then
   d:=jsonb_set(d,array[kind],(d->kind)-idx);
   if kind='photos' then result:=result||jsonb_build_object('deleted_path',rowval->>'object_path'); end if;
   if kind='quizzes' then d:=jsonb_set(d,'{quiz_answers}',coalesce((select jsonb_agg(a) from jsonb_array_elements(d->'quiz_answers') a where a->>'quiz_id'<>rid),'[]'::jsonb)); end if;
  else
   if kind not in ('notes','photos','tasks') then raise exception 'This item cannot be edited.'; end if;
   changed:=onlyus_private.item(kind,rowval||p_body);
   newrow:=rowval||changed||jsonb_build_object('version',(rowval->>'version')::integer+1);
   if kind='notes' then newrow:=newrow||jsonb_build_object('edited_by',n,'updated_at',stamp); end if;
   d:=jsonb_set(d,array[kind,idx::text],newrow);
  end if;
 elsif kind in ('notes','photos','tasks','events','quizzes') and rid='' and p_method='POST' then
  if jsonb_array_length(d->kind)>=(case when kind='photos' then 500 else 2000 end) then raise exception 'Collection limit reached. Export and remove some older items.'; end if;
  newrow:=onlyus_private.item(kind,p_body)||jsonb_build_object('id',new_id,'author',n,'created_at',stamp,'version',1);
  if kind='notes' then newrow:=newrow||jsonb_build_object('edited_by',n,'updated_at',stamp); end if;
  if kind='photos' then
   obj:=onlyus_private.txt(p_body,'object_path',1,160);
   if obj !~ ('^'||auth.uid()::text||'/[a-f0-9-]{36}\.jpg$') then raise exception 'Invalid photo path.'; end if;
   select (metadata->>'size')::bigint into bytes from storage.objects where bucket_id='only-us-photos' and name=obj;
   if bytes is null or bytes>2097152 then raise exception 'Upload a valid photo first (maximum 2 MB after resizing).'; end if;
   if exists(select 1 from jsonb_array_elements(d->'photos') p where p->>'object_path'=obj) then raise exception 'This photo is already saved.'; end if;
   if bytes+coalesce((select sum((p->>'size')::bigint) from jsonb_array_elements(d->'photos') p),0)>629145600 then raise exception 'Photo allowance reached. Export and remove older photos.'; end if;
   newrow:=newrow||jsonb_build_object('object_path',obj,'size',bytes);
  end if;
  d:=jsonb_set(d,array[kind],jsonb_build_array(newrow)||(d->kind));
 elsif p_path='settings' and p_method='PATCH' then
  st:=d->'settings';
  if coalesce((p_body->>'version')::integer,-1)<>(st->>'version')::integer then raise exception 'Settings changed. Refresh and try again.' using errcode='40001'; end if;
  s:=onlyus_private.txt(p_body,'timezone',1,80);
  if not exists(select 1 from pg_catalog.pg_timezone_names where name=s) then raise exception 'Choose a valid timezone such as Asia/Dubai.'; end if;
  st:=jsonb_build_object('id',1,'timezone',s,'version',(st->>'version')::integer+1,
   'start_date',onlyus_private.day(p_body,'start_date'),'ahmed_birthday',onlyus_private.day(p_body,'ahmed_birthday'),'mahra_birthday',onlyus_private.day(p_body,'mahra_birthday'));
  day:=to_char(now() at time zone s,'YYYY-MM-DD');
  if st->>'start_date'>day or st->>'ahmed_birthday'>day or st->>'mahra_birthday'>day then raise exception 'These dates cannot be in the future.'; end if;
  d:=jsonb_set(d,'{settings}',st);
 elsif p_path='mood' and p_method='POST' then
  s:=onlyus_private.txt(p_body,'mood',1,12);
  if s not in ('sunny','okay','low','hug','missing') then raise exception 'Choose a mood.'; end if;
  arr:=coalesce((select jsonb_agg(a) from jsonb_array_elements(d->'moods') a where not(a->>'day'=day and a->>'user_id'=n)
   and a->>'day'>=to_char(day::date-90,'YYYY-MM-DD')),'[]'::jsonb);
  d:=jsonb_set(d,'{moods}',arr||jsonb_build_array(jsonb_build_object('day',day,'user_id',n,'mood',s,'message',onlyus_private.txt(p_body,'message',0,240),'updated_at',stamp)));
 elsif p_path='daily' and p_method='POST' then
  if p_body->>'day' is distinct from day then raise exception 'A new day started. Reopen the question.'; end if;
  if (select count(*) from jsonb_array_elements(d->'daily_answers') a where a->>'day'=day)=2 then raise exception 'Both answers are revealed and locked for today.'; end if;

<script>/* Cloud adapter: browser-safe Supabase public key; credentials never embedded. */
window.OnlyUsCloud = (() => {
  'use strict';
  const cfg=window.ONLY_US_CONFIG, bucket='only-us-photos';
  const sessionKey='onlyus-session:'+cfg.url;
  let auth=null, refreshPromise=null, cache=null, cacheAt=0;
  const signed=new Map();
  try{auth=JSON.parse(sessionStorage.getItem(sessionKey)||'null');}catch{}
  function persist(value){auth=value;try{if(value)sessionStorage.setItem(sessionKey,JSON.stringify(value));else sessionStorage.removeItem(sessionKey);}catch{}}
  function error(message,status){const e=new Error(message);e.status=status;return e;}
  async function raw(path,method='GET',body=null,token=null,headers={}){
    let res;
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),25000);
    try{
      res=await fetch(cfg.url+path,{method,cache:'no-store',credentials:'omit',signal:controller.signal,
        headers:{apikey:cfg.key,...(token?{Authorization:'Bearer '+token}:{}),...(body instanceof Blob?{}:body!==null?{'Content-Type':'application/json'}:{}),...headers},
        ...(body!==null?{body:body instanceof Blob?body:JSON.stringify(body)}:{})});
    }catch{throw error('Cannot reach our shared space. Check your connection and that your Supabase project is running.',0);}
    finally{clearTimeout(timer);}
    const text=await res.text();let data;try{data=JSON.parse(text);}catch{data=text;}
    if(!res.ok){const message=data?.message||data?.msg||data?.error_description||data?.error||'The request could not be completed.';
      const code=data?.code==='40001'?409:res.status;
      if(data?.code==='PGRST202')throw error('Database setup is missing. Run the SQL from Connect shared space in your Supabase SQL Editor.',code);
      throw error(String(message),code);
    }
    return data;
  }
  async function token(){
    if(!auth?.access_token)throw error('Please sign in again.',401);
    if(auth.expires_at>Date.now()/1000+90)return auth.access_token;
    if(!refreshPromise)refreshPromise=(async()=>{
      try{const value=await raw('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:auth.refresh_token});persist({...value,expires_at:Date.now()/1000+value.expires_in});return auth.access_token;}

    }

      const src=await window.OnlyUsDemo.compress(body.image);

      catch(e){try{await raw('/storage/v1/object/'+bucket,'DELETE',{prefixes:[objectPath]},await token());}catch{}throw e;}

    }
    const result=await rpc('onlyus_write',{p_path:path,p_method:method,p_body:body});cache=null;
    if(result.deleted_path){
      signed.delete(result.deleted_path);
      try{await raw('/storage/v1/object/'+bucket,'DELETE',{prefixes:[result.deleted_path]},await token());}
      catch{console.warn('Photo metadata was removed. The project owner may need to remove the orphaned object from Storage.');}
    }
    return result;
  }
  return {request};
})();

function startMemory(){const symbols=['\u2615','\u2665','\u2600','\u263d','\u273f','\u2726'];const cards=[...symbols,...symbols];for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}memory={cards,open:[],matched:[],moves:0,started:0,seconds:0,finished:false,busy:false,pendingScore:false};paintMemory();}
function paintMemory(){const host=$('#memory-board');if(!host)return;if(!memory){host.innerHTML=`<div class="empty" style="min-height:256px">${icon('heart')}<p>Six pairs. One very cute challenge.</p>${button('Start matching '+icon('arrow'),'memory-start','','btn soft')}</div>`;return;}host.innerHTML=`<div class="memory-grid">${memory.cards.map((s,i)=>{const flipped=memory.open.includes(i),matched=memory.matched.includes(i);return `<button data-action="memory-flip" data-index="${i}" class="${matched?'matched':flipped?'flipped':''}" ${matched||flipped||memory.busy||memory.finished?'disabled':''} aria-label="${matched?'Matched':flipped?'Showing '+esc(s):'Face-down'} card ${i+1}">${matched||flipped?esc(s):'&amp;'}</button>`;}).join('')}</div><div class="memory-stats"><span>${memory.moves} moves</span><span id="memory-seconds">${memory.seconds}s</span></div><div style="min-height:36px;margin-top:10px">${memory.finished?`<p class="helper">All matched. You two have excellent taste. ${memory.pendingScore?button('Retry saving score','memory-save','','text-btn'):''}</p>`:''}${button(icon('refresh')+' Restart','memory-start','','text-btn')}</div>`;}
async function flipMemory(index){if(!memory||memory.busy||memory.finished||memory.open.includes(index)||memory.matched.includes(index))return;if(!memory.started)memory.started=Date.now();memory.open.push(index);paintMemory();if(memory.open.length===2){memory.moves++;const [a,b]=memory.open;memory.busy=true;if(memory.cards[a]===memory.cards[b]){memory.matched.push(a,b);memory.open=[];memory.busy=false;if(memory.matched.length===12){memory.finished=true;memory.seconds=Math.max(1,Math.round((Date.now()-memory.started)/1000));memory.pendingScore=true;paintMemory();await saveMemory();}else paintMemory();}else{const round=memory;paintMemory();setTimeout(()=>{if(memory===round){memory.open=[];memory.busy=false;paintMemory();}},800);}}}
async function saveMemory(){if(!memory?.pendingScore)return;await api('memory','POST',{moves:memory.moves,seconds:memory.seconds});memory.pendingScore=false;toast('A perfect match. Your score is saved.');await refresh(true);}
function dailyAnswers(){return `<div class="daily-answers">${['Ahmed','Mahra'].map(name=>{const answer=state.daily.answers.find(a=>a.user_id===name);return `<div class="answer-bubble"><div class="row">${avatar(name)}<strong style="font-size:12px">${name}</strong></div>${answer?`<p>${esc(answer.answer)}</p>`:`<div class="locked">${icon('lock')}<br>${state.daily.answered_by.includes(name)?'Answer saved. Waiting for both of you.':name===user?'Your answer belongs here.':'Waiting for '+name+'.'}</div>`}</div>`;}).join('')}</div>`;}
function quizCard(q){const author=q.author===user,mine=q.my_answer,answered=author||mine;return `<article class="card quiz-card"><div class="row between"><div class="row">${avatar(q.author)}<span class="helper">${author?'Your question for '+partner():'A question from '+q.author}</span></div>${author?button(icon('trash'),'delete-item',`data-id="${esc(q.id)}" data-kind="quizzes" aria-label="Delete quiz"`,'icon-btn'):''}</div><h3>${esc(q.question)}</h3><div class="quiz-options">${q.options.map((o,i)=>button(`<span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span>${answered&&i===q.correct?'<span class="spacer"></span>'+icon('check'):''}`,'quiz-answer',`data-id="${esc(q.id)}" data-choice="${i}" ${answered?'disabled':''}`,'quiz-option'+(answered&&i===q.correct?' correct':'')+(mine&&mine.choice===i&&!mine.is_correct?' wrong':''))).join('')}</div><p class="quiz-result">${author?(q.answers.length?`${esc(partner())} ${q.answers[0].is_correct?'got it right. You are known and loved.':'picked '+esc(q.options[q.answers[0].choice])+'. Another little thing to learn.'}`:'Correct answer shown only to you. Waiting for '+esc(partner())+'.'):mine?(mine.is_correct?'You know your person. Nice one!':'A new little detail to remember. The correct answer is highlighted.'):'One guess. No pressure. Just getting to know each other.'}</p></article>`;}
function quizzesPage(){const answered=state.quizzes.map(q=>q.my_answer).filter(Boolean),correct=answered.filter(a=>a.is_correct).length;return pageTop('STILL GETTING TO KNOW YOU','Us, unfiltered.','Our favorites, our stories, and all the little things that make us, us.',button(icon('plus')+' Make a quiz','new-quiz'))+`<section class="card mb"><div class="row between wrap"><span class="eyebrow">TODAY'S LITTLE CONNECTION</span><span class="pill pink">${state.daily.revealed?'Answers unlocked':state.daily.answered_by.length+'/2 answered'}</span></div><h2 class="mt" style="font-size:28px;line-height:1.35">${esc(state.daily.question)}</h2><p class="helper" style="margin-top:12px">Answer separately. Your partner's answer stays hidden until both of you reply.</p>${dailyAnswers()}${!state.daily.revealed?button(state.daily.answered_by.includes(user)?'Edit my answer '+icon('edit'):'Add my answer '+icon('arrow'),'daily-modal','','btn soft mt'):''}</section><div class="stats-bar card"><div><strong>${correct}</strong><span>you got right</span></div><div><strong>${answered.length}</strong><span>you answered</span></div><div><strong>${state.quizzes.filter(q=>q.author!==user&&!q.my_answer).length}</strong><span>waiting for you</span></div></div><div class="section-title"><div><h2>How well do you know me?</h2><p>Questions written by us. Not made-up facts about us.</p></div></div>${state.quizzes.length?`<div class="quiz-grid">${state.quizzes.map(quizCard).join('')}</div>`:`<div class="card">${empty('quiz','Make the first little challenge.','Your comfort food? Your dream date? Give four options and let your favorite person guess.',button('Write a question '+icon('plus'),'new-quiz'))}</div>`}`;}

n as ${esc(user)}</span></div><div class="settings-section"><h3>Your password</h3><p class="helper mb">${DEMO?'Passwords become available after online setup.':'Change your password using your current one. Sign out on shared devices.'}</p>${button(icon('lock')+' Change my password','change-password','','btn secondary small')}</div><div class="settings-section"><h3>A little lighter, or a little darker?</h3>${button(icon('moon')+' Switch appearance','theme','','btn secondary small')}<p class="helper" style="margin-top:10px">Appearance is saved on this device only.</p></div></section><section class="card"><h2>Keep the good stuff.</h2><p class="muted">Save a private copy of shared data and optimized photos.</p><div class="storage-bar"><div style="width:${Math.min(100,state.storage_used/state.storage_limit*100)}%"></div></div><p class="helper mb">${(state.storage_used/1048576).toFixed(1)} MB of ${(state.storage_limit/1048576).toFixed(0)} MB photo space used.</p>${button(icon('download')+' Export our memories','backup','','btn secondary small')}<p class="helper" style="margin-top:14px">The export excludes passwords, sessions, and unrevealed partner answers. It is readable, not encrypted; keep it somewhere private.</p></section><section class="card"><h2>A little daily habit.</h2><button class="btn secondary small mt" data-setup>${DEMO?'Connect shared space':'Connection settings'}</button><p class="helper mt">On your phone, open your hosted site in its browser menu and choose Add to Home Screen when available. Stay signed in on your own device only.</p><p class="helper mt">${DEMO?'Local mode saves only in this browser and has no real login protection. Export important data before clearing browser storage.':'The shared site requires internet. Both of you can edit shared material. Data is not end-to-end encrypted; the project owner can access it.'}</p></section></div></div>`;}

async function act(action,el){
  const id=el.dataset.id;
  if(action==='close-modal'){closeModal();return;}
  if(action==='show-password'){const input=document.getElementById(el.dataset.target);input.type=input.type==='password'?'text':'password';el.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');return;}
  if(action==='open-menu'||action==='close-menu'){const open=action==='open-menu';$('.sidebar')?.classList.toggle('open',open);$('.overlay')?.classList.toggle('open',open);return;}
  if(action==='theme'){theme=theme==='dark'?'light':'dark';store.set('onlyus-theme',theme);document.documentElement.dataset.theme=theme;$$('[data-action="theme"]').forEach(b=>{if(b.classList.contains('icon-btn'))b.innerHTML=icon(theme==='dark'?'sun':'moon');});return;}
  if(action==='demo-login'){const s=await api('login','POST',{username:el.dataset.user});user=s.user;csrf=s.csrf;state=null;page='home';await refresh(true);return;}
  if(action==='logout'){await api('logout','POST');user=null;state=null;memory=null;showLogin();return;}
  if(action==='reset-demo'){openModal("Clear this browser's local space?",`<p class="helper mb">This permanently erases the notes, photos, and settings saved in local mode on this browser. Export first. Your online space is not affected.</p><div class="form-actions">${button('Keep exploring','close-modal','','btn secondary')}${button('Clear local data','confirm-reset-demo','','btn')}</div>`);return;}
  if(action==='confirm-reset-demo'){await window.OnlyUsDemo.reset();user=null;state=null;showLogin();return;}
  if(action.startsWith('go-')){go(action.slice(3)==='notes'?'notes':action.slice(3));return;}
  if(action==='filter'){filter=el.dataset.filter;render();return;}
  if(action==='new-note'||action==='edit-note'){noteModal(action==='edit-note'?id:null);return;}
  if(action==='new-photo'||action==='edit-photo'){photoModal(action==='edit-photo'?id:null);return;}
  if(action==='new-task'){taskModal();return;}
  if(action==='new-quiz'){quizModal();return;}
  if(action==='new-event'){eventModal();return;}
  if(action==='daily-modal'){dailyModal();return;}
  if(action==='change-password'){if(DEMO){toast('Local profiles do not have passwords. Connect shared space to create real accounts.');return;}openModal('A new little secret.',formShell('password-form',passwordFields(),'Change my password '+icon('lock')));return;}
  if(action==='mood'){const own=state.moods.find(m=>m.user_id===user);openModal(`${moodData[el.dataset.mood][0]} A little check-in.`,formShell('mood-form',`<p class="helper">Feeling ${esc(moodData[el.dataset.mood][1].toLowerCase())}. Let ${esc(partner())} know what is on your mind.</p><div class="field"><label for="mood-message">Add a little context (optional)</label><textarea id="mood-message" name="message" maxlength="240" style="min-height:90px" placeholder="A long day. A little hug would help.">${esc(own?.message||'')}</textarea></div>`,'Share my mood '+icon('heart'),`data-mood="${el.dataset.mood}"`));return;}
  if(action==='pin-note'){const n=state.notes.find(n=>n.id===id);await api('notes/'+id,'PATCH',{pinned:!n.pinned,version:n.version});await refresh(true);return;}
  if(action==='photo-view'){const p=state.photos.find(p=>p.id===id);openModal('One for the memories.',`<img class="modal-photo" src="${esc(photoSrc(p))}" alt="${esc(p.caption||'Shared photo')}"><p class="serif preline mt" style="font-size:23px">${esc(p.caption||'A little moment, kept.')}</p><p class="helper mt">From ${esc(p.author)} &middot; ${formatDate(p.moment_date||p.created_at,{day:'numeric',month:'long',year:'numeric'})}</p><div class="form-actions mt">${button(icon('download')+' Save copy','download-photo',`data-id="${p.id}"`,'btn secondary small')}${button(icon('edit')+' Edit caption','edit-photo',`data-id="${p.id}"`,'btn secondary small')}${button(icon('trash'),'delete-item',`data-kind="photos" data-id="${p.id}" aria-label="Delete photo"`,'icon-btn')}</div>`,'photo-dialog');return;}
  if(action==='download-photo'){const p=state.photos.find(p=>p.id===id);const response=await fetch(photoSrc(p),{credentials:'same-origin'});if(!response.ok)throw new Error('Photo could not be downloaded.');downloadBlob(await response.blob(),'our-memory-'+p.id+'.jpg');return;}
  if(action==='delete-item'){const kind=el.dataset.kind;const item=state[kind].find(v=>v.id===id);openModal('Let this one go?',`<p class="helper mb">This ${kind==='photos'?'photo':'item'} will be removed for both of you. This cannot be undone here.</p><div class="form-actions">${button('Keep it','close-modal','','btn secondary')}${button('Yes, remove it','confirm-delete',`data-kind="${kind}" data-id="${id}" data-version="${item.version||0}"`,'btn danger')}</div>`);return;}
  if(action==='confirm-delete'){await api(el.dataset.kind+'/'+id,'DELETE',{version:Number(el.dataset.version)});closeModal();toast('Removed from our space.');await refresh(true);return;}
  if(action==='game-move'){await api('game/move','POST',{cell:Number(el.dataset.cell),version:state.game.version});await refresh(true);return;}
  if(action==='game-reset'){if(!state.game.winner&&state.game.board.some(Boolean)){openModal('A fresh start?',`<p class="helper mb">This will clear the current round for both of you.</p><div class="form-actions">${button('Keep playing','close-modal','','btn secondary')}${button('Start a new round','confirm-game-reset',`data-version="${state.game.version}"`)}</div>`);return;}await api('game/reset','POST',{version:state.game.version});await refresh(true);return;}
  if(action==='confirm-game-reset'){await api('game/reset','POST',{version:Number(el.dataset.version)});closeModal();await refresh(true);return;}
  if(action==='memory-start'){startMemory();return;}
  if(action==='memory-flip'){await flipMemory(Number(el.dataset.index));return;}
  if(action==='memory-save'){await saveMemory();return;}
  if(action==='spin-date'){adventureIndex=(adventureIndex+1+Math.floor(Math.random()*(content.adventures.length-1)))%content.adventures.length;render();return;}
  if(action==='save-date'){taskModal(content.adventures[adventureIndex%content.adventures.length].title);return;}
  if(action==='draw-card'){cardIndex++;render();return;}
  if(action==='quiz-answer'){await api('quizzes/'+id+'/answer','POST',{choice:Number(el.dataset.choice)});await refresh(true);return;}
  if(action==='next-joke'){const n=allowedJokes().length;jokeIndex=(jokeIndex+1+Math.floor(Math.random()*(n-1)))%n;render();return;}
  if(action==='favorite'){await api('favorite','POST',{joke_id:Number(id),remove:state.favorites.includes(Number(id))});await refresh(true);return;}
  if(action==='toggle-task'){const t=state.tasks.find(t=>t.id===id);await api('tasks/'+id,'PATCH',{done:!t.done,version:t.version});await refresh(true);return;}
  if(action==='calendar'){if(!state.events.some(e=>e.days_left>=0)){toast('Add an upcoming date or birthday first.');return;}const blob=await api('calendar','GET',null,true);downloadBlob(blob,'our-dates.ics');toast('Import the file into your calendar and check its reminder settings.');return;}
  if(action==='reminders'){const upcoming=state.events.filter(e=>e.days_left>=0&&e.days_left<=7);openModal('A little heads-up.',`<p class="helper">Our special dates in the next seven days.</p>${upcoming.length?upcoming.map(eventRow).join(''):empty('calendar','Nothing to miss this week.','Add birthdays and our anniversary in Our world.')}<div class="form-actions mt">${button('All our dates '+icon('arrow'),'go-plans','','btn secondary')}</div>`);return;}
  if(action==='hug'){await api('hug','POST');const heart=document.createElement('div');heart.className='hug-float';heart.textContent='\u2665';document.body.append(heart);setTimeout(()=>heart.remove(),1500);toast('A little love for '+partner()+'.');await refresh(true);return;}
  if(action==='backup'){
    openModal('Keep our memories safe.',`<p class="helper mb">Export a readable JSON archive of your data and resized photos. This is not encrypted and does not restore automatically. Keep the file private. ${DEMO?'Local profile data is included.':'Unrevealed partner answers are excluded.'}</p><div class="form-actions">${button('Cancel','close-modal','','btn secondary')}${button('Export our memories','confirm-export','','btn')}</div>`);return;
  }
  if(action==='confirm-export'){el.disabled=true;el.textContent='Packing our memories...';try{const blob=await api('backup','POST',{},true);downloadBlob(blob,'only-us-memories.json');closeModal();toast('Your private archive is ready. Keep it safe.');}finally{if(el.isConnected){el.disabled=false;el.textContent='Export our memories';}}return;}

}
async function submit(form){
  const data=new FormData(form),v=Object.fromEntries(data),id=form.dataset.id,version=Number(form.dataset.version);
  const error=$('.form-error',form);if(error)error.textContent='';
  const submitButton=$('button[type="submit"]',form);const label=submitButton.innerHTML;submitButton.disabled=true;submitButton.textContent='Saving...';
  try{
    if(form.id==='login-form'){submitButton.textContent='Opening our space...';const s=await api('login','POST',v);user=s.user;csrf=s.csrf;page='home';state=null;if(s.must_change)showPasswordChange();else await refresh(true);return;}
    if(form.id==='password-form'){if(v.new_password!==v.confirm_password)throw new Error('The new passwords do not match.');await api('password','POST',{current_password:v.current_password,new_password:v.new_password});closeModal();toast('Your password was updated. Sign out on any shared devices.');await refresh(true);return;}
    if(form.id==='settings-form'){await api('settings','PATCH',{...v,version});toast('Our important details are saved.');settingsDirty=false;await refresh(true);return;}
    if(form.id==='note-form')await api('notes'+(id?'/'+id:''),id?'PATCH':'POST',{...v,...(id?{version}:{})});
    else if(form.id==='photo-form'){if(id)await api('photos/'+id,'PATCH',{caption:v.caption,moment_date:v.moment_date,version});else{const file=data.get('photo');if(!(file instanceof File)||!file.size)throw new Error('Choose a photo first.');if(file.size>12*1024*1024)throw new Error('Choose a photo smaller than 12 MB.');submitButton.textContent='Keeping your memory...';await api('photos','POST',{caption:v.caption,moment_date:v.moment_date,image:await readFile(file)});}}
    else if(form.id==='mood-form')await api('mood','POST',{mood:form.dataset.mood,message:v.message});
    else if(form.id==='daily-form')await api('daily','POST',{answer:v.answer,day:form.dataset.day});
    else if(form.id==='task-form')await api('tasks','POST',v);
    else if(form.id==='event-form')await api('events','POST',{title:v.title,date:v.date,annual:data.has('annual')});
    else if(form.id==='quiz-form')await api('quizzes','POST',{question:v.question,options:[v.option0,v.option1,v.option2,v.option3],correct:Number(v.correct)});
    else if(form.id==='backup-form'){submitButton.textContent='Packing our memories...';const blob=await api('backup','POST',{password:v.password},true);downloadBlob(blob,'only-us-export.zip');closeModal();toast('Your private export is ready. Keep it safe.');return;}
    closeModal();toast(form.id==='mood-form'?'Your little check-in is shared.':form.id==='daily-form'?'Your answer is tucked away.':'Saved to our little world.');await refresh(true);
  }catch(e){if(error&&error.isConnected)error.textContent=e.message;else toast(e.message,true);}
  finally{if(submitButton.isConnected){submitButton.disabled=false;submitButton.innerHTML=label;}}
}
document.addEventListener('click',async event=>{
  const nav=event.target.closest('[data-page]');if(nav){go(nav.dataset.page);return;}
  const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
  event.preventDefault();const action=el.dataset.action;
  const networkActions=['hug','favorite','pin-note','game-move','game-reset','confirm-game-reset','quiz-answer','toggle-task','confirm-delete','logout','demo-login','calendar','download-photo','memory-save'];
  if(networkActions.includes(action))el.disabled=true;
  try{await act(action,el);}catch(e){toast(e.message,true);if(e.status===409)await refresh(true).catch(()=>{});}finally{if(el.isConnected)el.disabled=false;}
});
document.addEventListener('submit',e=>{if(e.target instanceof HTMLFormElement){e.preventDefault();submit(e.target);}});
document.addEventListener('input',e=>{if(e.target.closest('#settings-form'))settingsDirty=true;if(e.target.id==='note-search'){search=e.target.value;const notes=state.notes.filter(n=>(filter!=='pinned'||n.pinned)&&(!search||(n.title+' '+n.body).toLowerCase().includes(search.toLowerCase())));$('#notes-list').innerHTML=notes.map(noteCard).join('')+button(icon('plus')+' A little note goes a long way','new-note','','note-add');}});
document.addEventListener('change',e=>{if(['joke-cheeky','play-cheeky'].includes(e.target.id)){cheeky=e.target.checked;store.set('onlyus-cheeky',cheeky?'1':'0');jokeIndex=0;cardIndex=0;render();}if(e.target.id==='photo-file'){const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12*1048576){e.target.value='';toast('Choose a JPG, PNG, or WebP photo under 12 MB.',true);return;}const img=$('#upload-preview');readFile(file).then(src=>{if(img.isConnected){img.src=src;img.classList.remove('hidden');}}).catch(err=>toast(err.message,true));}});
document.addEventListener('focusout',()=>{if(pendingPaint&&!settingsDirty&&!$('#modal').open)setTimeout(()=>{if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))render();},50);});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal();}});
window.addEventListener('online',()=>refresh());document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
window.addEventListener('storage',e=>{if(DEMO&&e.key==='onlyus-html-local-v2')refresh(true).catch(()=>{});});
setInterval(()=>{if(user&&!document.hidden&&!$('#modal').open)refresh();},15000);
setInterval(()=>{updateClock();if(memory?.started&&!memory.finished){memory.seconds=Math.max(0,Math.floor((Date.now()-memory.started)/1000));if($('#memory-seconds'))$('#memory-seconds').textContent=memory.seconds+'s';}},1000);
async function boot(){
  try{content=window.ONLY_US_CONTENT;
    adventureIndex=Math.floor(Math.random()*content.adventures.length);jokeIndex=Math.floor(Math.random()*20);
    const session=await api('session');user=session.user;csrf=session.csrf||'';
    if(user){if(session.must_change)showPasswordChange();else await refresh(true);}else showLogin();
  }catch(e){showLogin(e.message);}
}
boot();
})();
</script>
<script>/* Optional online setup. Does not run a database or create accounts automatically. */
(() => {
 'use strict';
 const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dialog=$('#connect-dialog');
 function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
 function field(id,label,placeholder,value='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false"></div>`;}
 function show(){
  const c=window.ONLY_US_CONFIG;
  dialog.innerHTML=`<div class="modal-head"><div><span class="eyebrow">ONE FILE. TWO PEOPLE.</span><h2 id="connect-title">Connect our shared space.</h2></div><button class="icon-btn" data-setup-action="close" aria-label="Close setup">&#10005;</button></div>
  <p class="muted">The HTML is ready. A free-tier backend is what lets your phones share notes, photos, and games. No Python or Render needed.</p>
  <div class="notice mt mb">Until setup is complete, local profiles are only a demo. They are not password-protected and do not sync between phones. Do not add sensitive information to local mode.</div>
  <form id="cloud-setup-form">
  <section class="setup-step"><span class="setup-number">01</span><div><h3>Create your free backend.</h3><p>Open <a href="https://supabase.com/dashboard" target="_blank" rel="noopener noreferrer">Supabase</a>, create a <strong>Free</strong> project, and save its database password privately. Never enter that database password into this HTML.</p><p class="helper">The free tier currently includes 500 MB of database storage and 1 GB of file storage, with bandwidth limits. Inactive free projects can pause after one week. Check your dashboard for limits; no paid upgrade is needed for this setup.</p></div></section>
  <section class="setup-step"><span class="setup-number">02</span><div><h3>Create just your two accounts.</h3><p>In Supabase, go to <strong>Authentication &rarr; Users &rarr; Add user &rarr; Create new user</strong>. Use the email aliases below (or your own email addresses), choose two different passwords of at least 12 characters, and enable <strong>Auto Confirm User</strong> for each. These passwords belong in Supabase, not in this setup form.</p>
   <div class="fields-2">${field('setup-email-ahmed','Ahmed account email','ahmed@only-us.example',c.emails.Ahmed,'email')}${field('setup-email-mahra','Mahra account email','mahra@only-us.example',c.emails.Mahra,'email')}</div>
   <p class="helper">The default aliases are not mailboxes; recover forgotten passwords through the project dashboard. Email aliases are visible in the configured HTML. Using personal emails will make those visible too. After the two accounts exist, switch off <strong>Allow new users to sign up</strong> and <strong>Allow anonymous sign-ins</strong> under Authentication settings. Keep email/password sign-in enabled.</p>
   <p>Copy each account's User UID from the Users table into these boxes:</p>
   <div class="fields-2">${field('setup-id-ahmed','Ahmed User UID','xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx')}${field('setup-id-mahra','Mahra User UID','xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx')}</div>
  </div></section>
  <section class="setup-step"><span class="setup-number">03</span><div><h3>Set up the private database.</h3><p>Download the SQL below, open it in a text editor, copy all of it, and paste into <strong>Supabase &rarr; SQL Editor &rarr; New query</strong>. Press <strong>Run</strong>. This creates the two-account access checks and a <strong>private</strong> photo bucket. Use a new project, not a database that holds another app.</p>
   <button type="button" class="btn secondary small" data-setup-action="sql">Download database-setup.sql</button>
   <p class="helper">Never make the photo bucket public or remove the access checks. The two User UIDs above are inserted into the script, so only those users can read or write your space.</p>
  </div></section>
  <section class="setup-step"><span class="setup-number">04</span><div><h3>Connect this HTML.</h3><p>Find your <strong>Project URL</strong> and <strong>publishable key</strong> in the project's Connect dialog / API settings. A legacy <strong>anon</strong> key is also accepted. Public keys are designed for browser apps; your database access rules protect the data.</p>
   ${field('setup-url','Project URL','https://your-project.supabase.co',c.url,'url')}
   <div class="field"><label for="setup-key">Publishable key or legacy anon key</label><textarea id="setup-key" rows="3" style="min-height:86px" autocomplete="off" spellcheck="false" placeholder="sb_publishable_...">${esc(c.key)}</textarea></div>
   <p class="helper"><strong>Never use a secret, service_role, or database password here.</strong> This form rejects known server-only key types.</p>
   <div class="row wrap"><button type="submit" class="btn">Save connection &amp; open login</button><button type="button" class="btn secondary" data-setup-action="html">Download configured index.html</button></div>
   <p class="helper">The download contains the interface and public connection settings only, not notes, photos, passwords, or sessions. Local test data is not automatically copied into your online space.</p>
  </div></section>
  <section class="setup-step"><span class="setup-number">05</span><div><h3>Give it a free website address.</h3><p>Download the configured <strong>index.html</strong> using the button above. Put only that file inside a new folder named <strong>only-us-site</strong>. In <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare</a>, open <strong>Workers &amp; Pages</strong>, create a <strong>Pages</strong> project, and choose <strong>Direct Upload / Drag and drop</strong>. Upload the folder and deploy on the free tier. No GitHub connection or build command is needed.</p><p>Open the resulting HTTPS site address on both phones. Sign in with username <strong>Ahmed</strong> or <strong>Mahra</strong> and the passwords you created in step 2. In <strong>Our world</strong>, add your relationship start date and birthdays. Both accounts share the same online space.</p>
   <p class="helper">The HTML and login page are public; your shared data requires the approved accounts. Do not upload exported backups or private files. GitHub Pages on GitHub Free requires a public repository, so do not change your existing private repository to public just for this.</p>
  </div></section>
  <div id="setup-error" class="form-error" role="alert"></div>
  <details class="setup-details"><summary>Privacy, reminders, backups, and free-tier limits</summary>
   <p>Online data is account-restricted, not end-to-end encrypted. The project owner and backend provider can access stored data. Anyone with a logged-in device can use that account. Your session stays in this browser tab; close shared-device sessions with Sign out. Revoked access tokens may remain valid briefly until expiry.</p>
   <p>Photos are resized and re-encoded as JPEG in your browser, up to 1600 pixels and 2 MB. Keep originals. This app limits shared photos to 500 items / 600 MB, and text collections to 2,000 items each; the whole shared text document has a 12 MB limit. Provider quotas still apply. Moods keep 90 days; the love feed keeps the last 100 hugs and the total count; memory scores keep the best 100.</p>
   <p>Updates check roughly every 15 seconds while the page is visible; not offline sync. Birthday reminders are inside the site. Export the calendar and import it into a calendar app for alerts; re-export each year. No automatic emails, texts, or background push alerts are included.</p>
   <p>Use <strong>Our world &rarr; Export our memories</strong> for a readable JSON copy including processed photos. It contains private data and is not encrypted. It is an archive, not an automatic database restore. Free-tier automatic backups are not included. Local browser data can be cleared by your browser; export anything worth keeping.</p>
   <p>This is supplied source code, not an already-deployed service or an independently security-audited product. The online adapter and SQL have not been verified against a live Supabase project here. Test both logins and sharing before storing important material. Existing Render/Python data is not automatically migrated.</p>
  </details>
  <details class="setup-details"><summary>Official setup references (checked September 25, 2026)</summary><p><a href="https://supabase.com/pricing" target="_blank" rel="noopener noreferrer">Supabase free-plan limits</a> &middot; <a href="https://supabase.com/docs/guides/auth/general-configuration" target="_blank" rel="noopener noreferrer">Authentication settings</a> &middot; <a href="https://supabase.com/docs/guides/getting-started/api-keys" target="_blank" rel="noopener noreferrer">Public versus secret keys</a> &middot; <a href="https://supabase.com/docs/guides/database/functions" target="_blank" rel="noopener noreferrer">Database functions</a> &middot; <a href="https://supabase.com/docs/guides/storage/security/access-control" target="_blank" rel="noopener noreferrer">Storage access control</a> &middot; <a href="https://developers.cloudflare.com/pages/get-started/direct-upload/" target="_blank" rel="noopener noreferrer">Cloudflare Direct Upload</a> &middot; <a href="https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site" target="_blank" rel="noopener noreferrer">GitHub Pages availability</a></p></details>
  ${location.protocol==='file:'?'<button type="button" class="text-btn mt" data-setup-action="local">Return to local mode on this computer</button>':''}
  </form>`;
  dialog.showModal();
 }
 function config(){
  const url=$('#setup-url').value.trim().replace(/\/+$/,'');
  const key=$('#setup-key').value.trim();
  const emails={Ahmed:$('#setup-email-ahmed').value.trim().toLowerCase(),Mahra:$('#setup-email-mahra').value.trim().toLowerCase()};
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url))throw new Error('Enter your Supabase Project URL, such as https://abcdefgh.supabase.co.');
  if(key.startsWith('sb_secret_'))throw new Error('That is a secret key. Use the publishable key instead.');
  let valid=key.startsWith('sb_publishable_')&&key.length>25;
  if(key.startsWith('eyJ')){try{const part=key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const claims=JSON.parse(atob(part));valid=claims.role==='anon';}catch{valid=false;}}
  if(!valid)throw new Error('Use a publishable key (sb_publishable_...) or a legacy anon key. Never use service_role.');
  if(!Object.values(emails).every(v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))||emails.Ahmed===emails.Mahra)throw new Error('Use two different account email aliases matching Supabase.');
  return {url,key,emails};
 }
 function fail(e){$('#setup-error').textContent=e.message;$('#setup-error').scrollIntoView({block:'nearest',behavior:'smooth'});}
 function saveConfigured(){
  const c=config(),doc=document.documentElement.cloneNode(true);
  doc.querySelector('#onlyus-config').textContent=JSON.stringify(c).replace(/</g,'\\u003c');
  doc.querySelector('#app').innerHTML='<div class="boot"><span class="brand-mark">&amp;</span><p>Opening our little world...</p></div>';
  for(const sel of ['#modal','#toasts','#connect-dialog'])doc.querySelector(sel).innerHTML='';
  doc.querySelector('#connect-dialog').removeAttribute('open');doc.querySelector('#modal').removeAttribute('open');
  doc.querySelectorAll('.hug-float').forEach(el=>el.remove());
  doc.querySelector('body').className='';doc.dataset.theme='light';
  download(new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'}),'index.html');
 }
 document.addEventListener('click',async e=>{
  const open=e.target.closest('[data-setup]');if(open){e.preventDefault();show();return;}
  const el=e.target.closest('[data-setup-action]');if(!el)return;
  e.preventDefault();try{
   const action=el.dataset.setupAction;
   if(action==='close'){dialog.close();return;}
   if(action==='html'){saveConfigured();return;}
   if(action==='local'){
    if(window.OnlyUsCloud)await window.OnlyUsCloud.request('logout');
    localStorage.setItem(window.ONLY_US_CONFIG_KEY,JSON.stringify({url:'',key:'',emails:window.ONLY_US_CONFIG.emails}));
    location.reload();return;
   }
   if(action==='sql'){
    const ahmed=$('#setup-id-ahmed').value.trim(),mahra=$('#setup-id-mahra').value.trim();
    const pattern=/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i;
    if(!pattern.test(ahmed)||!pattern.test(mahra)||ahmed===mahra)throw new Error('Paste the two different User UIDs from Supabase Authentication > Users first.');
    const sql=$('#onlyus-database-template').textContent.replace(/AHMED_USER_ID/g,ahmed).replace(/MAHRA_USER_ID/g,mahra);
    download(new Blob([sql],{type:'text/plain;charset=utf-8'}),'database-setup.sql');
   }
  }catch(err){fail(err);}
 });
