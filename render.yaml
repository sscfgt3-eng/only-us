# This blueprint uses a PAID web service and persistent disk.
# Review the current provider pricing before applying it.
services:
  - type: web
    name: only-us
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/only-us
      - key: AHMED_INITIAL_PASSWORD
        sync: false
      - key: MAHRA_INITIAL_PASSWORD
        sync: false
      - key: MAX_STORAGE_MB
        value: 600
    disk:
      name: only-us-memories
      mountPath: /var/data
      sizeGB: 1
